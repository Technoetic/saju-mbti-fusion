name: CI/CD — Test & Deploy

# ADR-057: paths-filter 도입 + ADR-056 Fly.io 배포 통합
# - engine/ 변경 시만 engine 테스트
# - web/·front/·data/·Dockerfile·fly.toml 변경 시만 deploy
# - tests/ 변경은 회귀 전체
# - vault/·.gitignore 변경은 무시

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ADR-057 paths-filter: 변경 경로 감지 → 후속 job 조건부 실행
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
      front: ${{ steps.filter.outputs.front }}
      tests: ${{ steps.filter.outputs.tests }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - 'requirements.txt'
            web:
              - 'web/**'
              - 'requirements.txt'
            front:
              - 'front/**'
            tests:
              - 'tests/**'
              - 'pytest.ini'
            deploy:
              - 'engine/**'
              - 'web/**'
              - 'front/**'
              - 'data/**'
              - 'assets/**'
              - 'Dockerfile'
              - 'fly.toml'
              - 'requirements.txt'
              - 'requirements-ml.txt'
              - '.github/workflows/deploy.yml'

  test:
    name: Lint & Import Check
    needs: changes
    if: |
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test (engine + web modules load)
        if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -c "from web.server import app; print('FastAPI app routes:', len(app.routes))"
          python -c "from engine.divination.face.reading import generate_face_reading; print('face_reading loaded')"
          python -c "from engine.saju import pillars, luck_cycle, ten_gods; print('saju engine loaded')"

      - name: Pytest — engine 단위 테스트 (필수)
        if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.tests == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install pytest
          if compgen -G "engine/**/test_*.py" > /dev/null; then
            pytest -x --tb=short engine/
          else
            echo "no engine test files yet — skipping"
          fi
        shell: bash

      - name: Pytest — 회귀 + smoke (tests/)
        if: needs.changes.outputs.tests == 'true' || needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium
          pytest --tb=short tests/smoke/ tests/regression/ -m "not live"
        shell: bash

  deploy:
    name: Deploy to Fly.io
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ADR-243: CFM 빌드 + 학습 ~30-45분
    # ADR-247 — workflow_dispatch 도 deploy 트리거 허용 (수동 재배포 필요 시).
    # paths-filter 미트리거 상황(.gitignore 변경·빈 commit·tests/ 만 변경)을
    # 수동 우회.
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.deploy == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # ADR-245 — 가중치 repo 포함 → 빌드 시 COPY만, 학습 X.
        # ENABLE_PALM_UNET=1 은 Dockerfile 기본값. PyTorch만 설치.
        # 빌드 ~5분, 이미지 +300MB (PyTorch wheel).
        run: flyctl deploy --remote-only --ha=false

      - name: Verify live
        run: |
          for i in $(seq 1 12); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://saju-mbti-fusion.fly.dev/api/health || echo 000)
            echo "attempt $i: live HTTP=$code"
            if [ "$code" = "200" ]; then
              echo "✅ Fly.io deployment live"
              exit 0
            fi
          done
          echo "❌ Live did not reach 200 within 120s"
          exit 1
