<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="dark_bleed" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="3" seed="17"/>
      <feColorMatrix values="0 0 0 0 0.02
                             0 0 0 0 0.015
                             0 0 0 0 0.025
                             0.55 0 0 0 -0.12"/>
    </filter>
    <filter id="strokes" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.03 0.42" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.04
                             0 0 0 0 0.02
                             0 0 0 0 0.05
                             0.4 0 0 0 -0.18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.06
                             0 0 0 0 0.05
                             0 0 0 0 0.06
                             0.28 0 0 0 -0.1"/>
    </filter>
  </defs>
  <rect width="1200" height="1600" filter="url(#dark_bleed)"/>
  <rect width="1200" height="1600" filter="url(#strokes)" opacity="0.55"/>
  <rect width="1200" height="1600" filter="url(#grain)" opacity="0.32"/>
</svg>
