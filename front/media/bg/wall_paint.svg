<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="bleed" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="3" seed="17"/>
      <feColorMatrix values="0 0 0 0 0.34
                             0 0 0 0 0.10
                             0 0 0 0 0.17
                             0.6 0 0 0 -0.16"/>
    </filter>
    <filter id="strokes" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.32" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.10
                             0 0 0 0 0.05
                             0 0 0 0 0.07
                             0.5 0 0 0 -0.15"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.08
                             0 0 0 0 0.06
                             0 0 0 0 0.08
                             0.4 0 0 0 -0.12"/>
    </filter>
    <filter id="warm" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.007" numOctaves="2" seed="23"/>
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.15
                             0 0 0 0 0.18
                             0.55 0 0 0 -0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="1600" filter="url(#bleed)"/>
  <rect width="1200" height="1600" filter="url(#strokes)" opacity="0.5"/>
  <rect width="1200" height="1600" filter="url(#warm)" opacity="0.7"/>
  <rect width="1200" height="1600" filter="url(#grain)" opacity="0.35"/>
</svg>
